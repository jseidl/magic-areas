name: Run tests with latest stable Home Assistant

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  test-stable:
    name: "Test against stable release"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install tox and jq
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          sudo apt-get update && sudo apt-get install -y jq

      - name: Get latest HA stable version from PyPI
        run: |
          VERSIONS=$(curl -s https://pypi.org/pypi/homeassistant/json | jq -r '.releases | keys | .[]')
          HA_MAJOR_VERSION=$(echo "$VERSIONS" | grep -Ev '[a-zA-Z]' | grep '\.0$' | sort -Vr | head -n1)
          echo "HA_MAJOR_VERSION=$HA_MAJOR_VERSION" >> $GITHUB_ENV

      - name: Run tox for stable
        run: tox -e ha-major
        env:
          HA_MAJOR_VERSION: ${{ env.HA_MAJOR_VERSION }}

