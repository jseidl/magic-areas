name: Run tests with latest stable Home Assistant

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  test-stable:
    name: "Test against stable release"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7"

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: "Install requirements"
        run: python3 -m pip install -r requirements-test.txt

      - name: "Run tests against stable"
        run: scripts/test stable tests/
